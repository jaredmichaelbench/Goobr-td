; Night 1: Night Life. The level template (L3, D-0048), v3 (D-0052).
; Edit freely: the game reads this file each time the level starts.
; Anything after a ; is a note for people and is ignored.
;
; The song is 130 BPM: a bar is 4 beats, about 1.85 seconds. It is 96 bars long.
; Its shape (from the waveform): bars 1-8 a quiet intro, 9-32 the groove (a short
; drop on bar 32), 33-48 the chorus, 49-56 a quiet breakdown, 57-80 the groove
; again (drop on 80), 81-96 the last chorus.

name = Night 1: Night Life
song = 13. Night Life.wav     ; the file in game/audio
count = 2                     ; bars of drumsticks before the song: the build phase
gold = 150                    ; gold when the night starts
price_step = 0.05             ; each tower on the board makes the next one 5% dearer (walls never)
reach = 4                     ; build within this many tiles of the keep or of anything you built
mine = 4                      ; never within this many tiles of the mine (0 turns a rule off)
asks = q parry                ; what this night asks: q e parry stagger counter

; The sections, in song order, one per line:
;   name   kind   bars   tier   what comes
; kind:  push    enemies come
;        lull    nothing comes; the music calms and lifts again on its last bar
;        finale  the last push; put "boss" in what comes for a field boss
; tier:  how strong the enemies are, like that wave of the 20-wave run
;        (health, speed, and how long the calls are). Lulls need no tier.
; what comes: groups in order, split by commas. "grunt 8 @2" is eight grunts,
;        one every 2 beats (@1 = every beat, @0.5 = twice a beat).
;        Enemies: grunt runner swarm brute shade jammer archer warden
;        "quiet" in what comes: no calls in that push (build time).
;        "boss at 4": the boss walks in 4 bars into the section (any push).
;        A lull can carry a light trickle too: "grunt 3 @8". Its music stays calm
;        and it asks for no notes.
; Leave a few bars at the end of a push for the board to clear before a lull.

intro     push    8  1   quiet, grunt 4 @4
verse     push   16  2   grunt 8 @2, runner 3 @1, grunt 6 @2, jammer 1
rise      lull    8      grunt 3 @8
chorus    push   16  3   grunt 6 @1.5, swarm 6 @0.5, brute 2 @3, runner 4 @1, archer 1, grunt 6 @1.5
breakdown lull    8      grunt 3 @8, runner 1
groove    push   24  4   boss at 16, shade 2, grunt 10 @1.5, jammer 1, swarm 8 @0.5, brute 3, runner 8 @1, warden 1, swarm 8 @0.5, shade 2, archer 1, grunt 10 @1.5
finale    finale 16  5   grunt 6 @1.5, swarm 8 @0.5, brute 3, runner 6 @1, swarm 8 @0.5
