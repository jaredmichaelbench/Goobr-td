; Night 5: Flanger Party, then Psychedelia Flashback (B1+B2 draft, D-0066,
; D-0067). The format is explained in night_life.cfg. Nothing new: everything
; together. The Night Manager opens the night at the top of Flanger Party. When
; the overtime song (Psychedelia Flashback, D-0066) starts, the rugpull: The
; Landlord walks in (Jared, 2026-11-03; if the manager is still up he waits for
; him to fall). Stomps (a two-bar wind-up; if it lands, nearby towers lock and the
; two nearest walls crack) and Volleys at the camp (4 bolts early, 6 mid, 8 late),
; and a Last Orders as he arrives.
; Flanger Party is 130 BPM, 80 bars, loud from bar 1 with dips at 17-18 and
; 57-58. Psychedelia Flashback is 52 bars. 132 bars in all, about 4 minutes.

name = Night 5: Flanger Party
song = 11. Flanger Party.wav
overtime = 3. Psychedelia Flashback.wav   ; plays straight after the song, same clock
count = 2
gold = 250
price_step = 0.07
reach = 4
mine = 4
asks = q e parry stagger

arrival    push   16  5   boss, grunt 8 @2, runner 4 @1, door 2 @3
dip        lull    2
rise       push   14  6   grunt 8 @1.5, busker 1, swarm 8 @0.5, spanner 1, hush 2 @3
chorus     push   24  6   grunt 10 @1.5, digger 2 @4, moth 8 @0.25, potshot 1, brute 3 @2, crossing_guard 1, undertaker 1, swarm 8 @0.5
dip2       lull    2
build      push   14  7   grunt 8 @1.5, door 3 @2, busker 1, runner 6 @1, hush 2 @3
last       push    8  7   swarm 10 @0.5, grunt 6 @1
overtime   finale 52  8   boss landlord, last_orders 1, grunt 10 @1.5, moth 10 @0.25, brute 3 @2, digger 2 @4, swarm 10 @0.5, spanner 1, runner 8 @1, moth 10 @0.25, grunt 10 @1.5

