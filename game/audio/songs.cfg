; Tempo for the test songs in this folder. Read by M3/M4 at startup.
; "default" covers every WAV; add a line per file to override, for example:
;   "9. Space Invaders.wav" = 130
; The VOiD1 SynthWave pack is 130 BPM throughout (every track is a whole
; number of bars at 130).
[bpm]
default = 130

; Sound effect pack per song (optional). A pack is a folder under sfx/ with
; files named as in docs/notes/sound-sheet-2026-10-25.md. "default" covers
; every song; missing files fall back to sfx/ itself, then the built-in synth.
;   [sfx]
;   default = synthwave
;   "9. Space Invaders.wav" = arcade
[sfx]
