; Night 5: Flanger Party, then Psychedelia Flashback (B1+B2 draft, D-0066,
; D-0067). The format is explained in night_life.cfg. Nothing new: everything
; together. The Landlord walks in at the top of the song and fights through
; every section: Stomps (a two-bar wind-up; if it lands, nearby towers lock and
; the two nearest walls crack) and Volleys at the camp (4 bolts early, 6 mid, 8
; late). When Flanger Party ends the fight runs on into Psychedelia Flashback
; (overtime, D-0066), and he calls a Last Orders as it starts.
; Flanger Party is 130 BPM, 80 bars, loud from bar 1 with dips at 17-18 and
; 57-58. Psychedelia Flashback is 52 bars. 132 bars in all, about 4 minutes.

